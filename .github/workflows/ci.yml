name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # test_settings: SQLite in-memory, keine Secrets, keine MySQL nötig.
      DJANGO_SETTINGS_MODULE: djangoproject.test_settings
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # wie das Docker-Basisimage
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: System checks
        run: python manage.py check

      - name: Fehlende Migrationen
        # test_settings schaltet die slg-Migrationen ab; für den Check deshalb die
        # normalen Settings. Ohne MySQL warnt makemigrations nur (History-Check).
        env:
          DJANGO_SETTINGS_MODULE: djangoproject.settings
          DJANGO_DEBUG: "1"
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test --settings=djangoproject.test_settings --noinput

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript unit tests
        run: node --test scripts/test_ui_language.cjs scripts/test_webmcp_browser.cjs

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: djangoproject.browser_test_settings
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python and Chromium dependencies
        run: |
          python -m pip install -r requirements.txt playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Browser smoke tests
        run: python manage.py test scripts.browser_smoke --noinput
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-smoke
          path: browser-smoke-artifacts/
          if-no-files-found: ignore
