{% load slg_extras %}

<style>
  /* ── Filter Panel – AETCAR Gold/Neutral Dark ────── */
  .offcanvas.offcanvas-start {
    width: min(420px, 100vw);
    background: #141414;
    border-right: 1px solid rgba(255, 255, 255, 0.06);
    display: flex;
    flex-direction: column;
  }

  .offcanvas-header {
    padding: 1.15rem 1.25rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    background: #101010;
    flex-shrink: 0;
  }

  .offcanvas-title {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: #f0f0f0;
    letter-spacing: 0.02em;
  }

  .offcanvas-header .btn-close {
    filter: invert(1) grayscale(100%) brightness(200%);
    opacity: 0.5;
  }
  .offcanvas-header .btn-close:hover { opacity: 0.9; }

  .offcanvas-body {
    padding: 1rem 1rem 0;
    flex: 1 1 auto;
    overflow-y: auto;
    padding-bottom: 5.5rem;
  }

  /* ── Sticky search button at bottom ──────────────── */
  .facet-sticky-footer {
    position: sticky;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 10;
    padding: 1rem 1rem 1.15rem;
    background: linear-gradient(0deg, #101010 70%, rgba(16, 16, 16, 0.95) 85%, rgba(16, 16, 16, 0) 100%);
    pointer-events: none;
  }

  .facet-sticky-footer .facet-search-button {
    pointer-events: auto;
    width: 100%;
    min-height: 50px;
    border: 0;
    border-radius: 14px;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.02em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f6b15d 0%, #d4944a 100%);
    color: #000;
    box-shadow: 0 6px 20px rgba(246, 177, 93, 0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    cursor: pointer;
  }
  .facet-sticky-footer .facet-search-button:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 28px rgba(246, 177, 93, 0.4);
  }
  .facet-sticky-footer .facet-search-button:active {
    transform: translateY(0);
  }

  /* ── Labels ──────────────────────────────────────── */
  .facets-wrapper label {
    display: inline-block;
    margin-bottom: 0.4rem;
    font-weight: 600;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: #a0a0a0;
  }

  /* ── Form controls (dark) ────────────────────────── */
  .facets-wrapper .form-control,
  .facets-wrapper .form-select,
  .facets-wrapper .select2-container--default .select2-selection--single,
  .facets-wrapper .select2-container--default .select2-selection--multiple {
    width: 100% !important;
    min-height: 44px;
    border-radius: 10px !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    background-color: #0e0e0e !important;
    color: #f0f0f0;
    box-shadow: none;
    transition:
      border-color 0.2s ease,
      box-shadow 0.2s ease;
  }

  .facets-wrapper input.form-control,
  .facets-wrapper textarea.form-control {
    background-image: none !important;
  }

  .facets-wrapper .form-control,
  .facets-wrapper .form-select {
    padding: 0.6rem 0.9rem;
    color: #f0f0f0;
  }

  .facets-wrapper .form-control:focus,
  .facets-wrapper .form-select:focus,
  .facets-wrapper .select2-container--default.select2-container--focus .select2-selection--multiple,
  .facets-wrapper .select2-container--default.select2-container--open .select2-selection--single,
  .facets-wrapper .select2-container--default.select2-container--open .select2-selection--multiple {
    border-color: rgba(246, 177, 93, 0.55) !important;
    box-shadow: 0 0 0 3px rgba(246, 177, 93, 0.12) !important;
    outline: none;
    background-color: #0e0e0e !important;
  }

  .facets-wrapper input::placeholder {
    color: #666;
  }

  .facets-wrapper .form-select {
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23a0a0a0' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e") !important;
    background-repeat: no-repeat !important;
    background-position: right 0.75rem center !important;
    background-size: 16px 12px !important;
  }

  .facets-wrapper select.form-select[data-select2-id],
  .facets-wrapper select.form-control[data-select2-id] {
    background-image: none !important;
  }

  .facets-wrapper .select2-container--default .select2-selection--single .select2-selection__arrow b {
    border-color: #a0a0a0 transparent transparent transparent;
  }
  .facets-wrapper .select2-container--default.select2-container--open .select2-selection--single .select2-selection__arrow b {
    border-color: transparent transparent #a0a0a0 transparent;
  }

  /* Select2 dropdown (renders in body, outside .facets-wrapper) */
  .select2-container--default .select2-dropdown {
    background-color: #1e1e1e;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    overflow: hidden;
  }
  .select2-container--default .select2-search--dropdown .select2-search__field {
    background: #0e0e0e;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    color: #f0f0f0;
    padding: 0.5rem 0.75rem;
  }
  .select2-container--default .select2-results__option {
    color: #d0d0d0;
    padding: 0.5rem 0.75rem;
  }
  .select2-container--default .select2-results__option--highlighted[aria-selected] {
    background-color: rgba(246, 177, 93, 0.22);
    color: #fff;
  }
  .select2-container--default .select2-results__option[aria-selected="true"] {
    background-color: rgba(246, 177, 93, 0.12);
    color: #fcd9a0;
  }
  .select2-container--default .select2-results__group {
    color: #666;
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.5rem 0.75rem 0.25rem;
  }

  /* ── Facets wrapper grid ─────────────────────────── */
  .facets-wrapper {
    display: grid;
    gap: 0.75rem;
    background: transparent;
    padding: 0;
  }

  /* ── Accordion (dark cards) ──────────────────────── */
  .facets-wrapper .accordion {
    --bs-accordion-bg: transparent;
    --bs-accordion-border-width: 0;
    --bs-accordion-border-color: transparent;
  }

  .facets-wrapper .accordion-item {
    border: 0 !important;
    border-color: transparent !important;
    outline: 0 !important;
    border-radius: 12px !important;
    margin-bottom: 0.5rem;
    background: #1e1e1e;
    box-shadow: none !important;
    overflow: hidden;
    transition:
      box-shadow 0.2s ease,
      border-color 0.2s ease;
  }

  .facets-wrapper .accordion-item:hover {
    border-color: transparent !important;
    box-shadow: none !important;
  }

  .facets-wrapper .accordion-button {
    gap: 0.25rem;
    font-size: 0.92rem;
    font-weight: 600;
    color: #d0d0d0;
    padding: 0.85rem 1rem;
    background-color: #1e1e1e;
    border: 0 !important;
    border-color: transparent !important;
    outline: 0 !important;
    box-shadow: none !important;
  }

  .facets-wrapper .accordion-button:not(.collapsed) {
    background: rgba(246, 177, 93, 0.08);
    color: #fcd9a0;
  }

  .facets-wrapper .accordion-button::after {
    width: 0.9rem;
    height: 0.9rem;
    background-size: 0.9rem;
    filter: invert(0.7);
  }

  .facets-wrapper .accordion-button .text-primary {
    color: #f6b15d !important;
  }

  .facets-wrapper .accordion-body {
    padding: 0.9rem 1rem 1rem;
    background-color: #1e1e1e;
    border-color: transparent !important;
    border-top: 0;
  }

  .facets-wrapper .form-group {
    margin-bottom: 0.85rem;
  }

  .facets-wrapper .form-group:last-child {
    margin-bottom: 0;
  }

  .facets-wrapper h5 {
    font-size: 0.85rem;
    font-weight: 600;
    color: #a0a0a0;
    margin-bottom: 0.4rem;
    margin-top: 0;
  }

  /* ── Select2 (dark) ─────────────────────────────── */
  .facets-wrapper .select2-container {
    width: 100% !important;
  }

  .facets-wrapper .select2-container .select2-search--inline .select2-search__field {
    margin-top: 0;
    font-size: 0.9rem;
    color: #f0f0f0;
  }

  .facets-wrapper .select2-container--default .select2-selection--single .select2-selection__rendered {
    line-height: 42px;
    padding-left: 0.9rem;
    padding-right: 2rem;
    color: #f0f0f0;
  }

  .facets-wrapper .select2-container--default .select2-selection--single .select2-selection__arrow {
    height: 42px;
    right: 0.5rem;
  }

  .facets-wrapper .select2-container--default .select2-selection--multiple {
    padding: 0.3rem 0.4rem;
  }

  .facets-wrapper .select2-container--default .select2-selection--multiple .select2-selection__choice {
    margin-top: 0.2rem;
    border: 0;
    border-radius: 999px;
    background: rgba(246, 177, 93, 0.18);
    color: #fcd9a0;
    padding: 0.2rem 0.5rem;
    font-size: 0.82rem;
  }

  .facets-wrapper .select2-container--default .select2-selection--multiple .select2-selection__choice__remove {
    color: #fcd9a0;
    margin-right: 0.3rem;
  }

  /* ── Date filter (dark card) ────────────────────── */
  .date-filter-container {
    padding: 0.9rem 1rem 1rem;
    background: #1e1e1e;
    border: 0 !important;
    border-color: transparent !important;
    outline: 0 !important;
    border-radius: 12px;
    margin-top: 0;
    margin-bottom: 0.25rem;
    box-shadow: none !important;
  }

  .date-filter-container .row {
    --bs-gutter-x: 0.75rem;
  }

  @media (max-width: 575.98px) {
    .offcanvas-body {
      padding: 0.85rem 0.8rem 0;
      padding-bottom: 5.5rem;
    }

    .facets-wrapper .accordion-body,
    .date-filter-container {
      padding-left: 0.85rem;
      padding-right: 0.85rem;
    }
  }
</style>
<div class="facets-wrapper">
  <!-- Filter Akkordeon -->
  <div class="accordion" id="filterAccordion">
    <!-- Textsuche & Eingrenzung -->
    {% include 'slg/search_form.html' %}

    <!-- Sammlungen -->
    <div class="accordion-item">
      <h2 class="accordion-header" id="sammlungenUndTeileHeading">
        <button
          class="accordion-button collapsed"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#sammlungenUndTeileCollapse"
          aria-expanded="false"
          aria-controls="sammlungenUndTeileCollapse"
        >
          <i class="bi bi-collection me-2 text-primary"></i>
          Sammlungen und Sammlungsteile
        </button>
      </h2>
      <div
        id="sammlungenUndTeileCollapse"
        class="accordion-collapse collapse"
        aria-labelledby="sammlungenUndTeileHeading"
        data-bs-parent="#filterAccordion"
      >
        <div class="accordion-body">
          <div class="form-group">
            <label for="SlgSelect">Sammlung</label>
            <select
              name="Slg"
              class="form-control select2-filter"
              id="SlgSelect"
            >
              <option value="">Alle Sammlungen</option>
            </select>
          </div>
          <div class="form-group mt-3">
            <label for="SlgteilSelect">Sammlungsteil</label>
            <select
              name="SlgTeil"
              class="form-control select2-filter"
              id="SlgteilSelect"
              disabled
            >
              <option value="">Bitte zuerst eine Sammlung auswählen</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Vorderseite -->
    <div class="accordion-item">
      <h2 class="accordion-header" id="vorderseiteHeading">
        <button
          class="accordion-button collapsed"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#vorderseiteCollapse"
          aria-expanded="false"
          aria-controls="vorderseiteCollapse"
        >
          <i class="bi bi-circle me-2 text-primary"></i>
          Vorderseite
        </button>
      </h2>
      <div
        id="vorderseiteCollapse"
        class="accordion-collapse collapse"
        aria-labelledby="vorderseiteHeading"
        data-bs-parent="#filterAccordion"
      >
        <div class="accordion-body">
          <div class="form-group">
            <label>Legende</label>
            <input
              type="text"
              name="avleg"
              class="form-control text-input-filter"
              value="{{ request.GET.avleg }}"
              placeholder="Suchen..."
            />
          </div>
          <div class="form-group mt-3">
            <label for="AvBildtypSelect">Beschreibungen</label>
            <select
              name="av_bildtyp"
              id="AvBildtypSelect"
              class="form-control select2-filter"
              multiple
            ></select>
          </div>
          <div class="form-group mt-3">
            <label for="AvSchlagworteFormControlSelect2">Schlagworte</label>
            <select
              name="av_schlagwort"
              id="AvSchlagworteFormControlSelect2"
              class="form-control select2-filter"
              multiple
            ></select>
          </div>
          <div class="form-group mt-3">
            <label>Dargestellte/r</label>
            <select
              name="Dargestellte_AV"
              id="AvDargestellteSelect"
              class="form-control select2-filter"
              multiple
            ></select>
          </div>
        </div>
      </div>
    </div>

    <!-- Rückseite -->
    <div class="accordion-item">
      <h2 class="accordion-header" id="rueckseiteHeading">
        <button
          class="accordion-button collapsed"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#rueckseiteCollapse"
          aria-expanded="false"
          aria-controls="rueckseiteCollapse"
        >
          <i class="bi bi-circle-fill me-2 text-primary"></i>

      <div
        id="rueckseiteCollapse"
        class="accordion-collapse collapse"
        aria-labelledby="rueckseiteHeading"

        <div class="accordion-body">
          <div class="form-group">
            <label>Legende</label>

          <div class="form-group mt-3">
            <label for="RvBildtypSelect">Beschreibungen</label>
            <select
              name="rv_bildtyp"
              id="RvBildtypSelect"
              class="form-control select2-filter"
              multiple
            ></select>
          </div>
          <div class="form-group mt-3">
            <label for="RvSchlagworteFormControlSelect2">Schlagworte</label>
            <select
              name="rv_schlagwort"
              id="RvSchlagworteFormControlSelect2"

    <!-- Nominale -->
    <div class="accordion-item">
      <h2 class="accordion-header" id="nominaleHeading">
        <button
          class="accordion-button collapsed"

      <div

            ></select>

    <!-- Material -->
    <div class="accordion-item">
      <h2 class="accordion-header" id="materialHeading">

    <!-- Merkmale -->

      <h2 class="accordion-header" id="merkmaleHeading">

    <!-- Wappen -->
    <div class="accordion-item">
      <h2 class="accordion-header" id="wappenHeading">

        >

      <div

        <div class="accordion-body">

            <select
              name="Wappen"
              id="WappenSelect"
              class="form-control select2-filter"
              multiple
            ></select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Datierung -->
  <div class="date-filter-container">
    <label>
      <i class="bi bi-calendar-range me-2 text-primary"></i>
      Datierung
    </label>
    <div class="row gx-2 mt-2">
      <div class="col-6">
        <input
          type="number"
          class="form-control text-input-filter form-control-sm"
          id="dat_von"
          name="dat_von"
          step="1"
          value="{{ request.GET.dat_von }}"
          placeholder="von"
        />
      </div>
      <div class="col-6">
        <input
          type="number"
          class="form-control text-input-filter form-control-sm"
          id="dat_bis"
          name="dat_bis"
          step="1"
          value="{{ request.GET.dat_bis }}"
          placeholder="bis"
        />
      </div>
    </div>
  </div>
</div>

<!-- Sticky Suchen-Button (immer sichtbar am unteren Rand) -->
<div class="facet-sticky-footer">
  {% if 'browse' in request.path %}
  <button type="button" class="facet-search-button" onclick="executeSearch();">
  {% else %}
  <button type="submit" class="facet-search-button" form="freitextForm">
  {% endif %}
    <i class="bi bi-search me-2"></i> Suchen
  </button>
</div>

<!-- Am Ende der Datei, vor dem schließenden </body> Tag -->
<script>
  /***************** Utilities *****************/
  const debounce = (fn, wait = 250) => {
      let t;
      return (...a) => {
          clearTimeout(t);
          t = setTimeout(() => fn.apply(this, a), wait);
      };
  };
  const q = sel => document.querySelector(sel);

  /* ---------- Helper, den jedes Facet benutzt ------------------- */
  function buildFacetUrl(facetField, extra = {}) {
      const p = new URLSearchParams(window.location.search);

      // Parameter entfernen, aber NICHT bei Kombination von Personen-Facets
      const personFacets = ['Praegeherren', 'Dargestellte_AV', 'Dargestellte_RV', 'Person'];

      if (personFacets.includes(facetField)) {
          // Bei Personenfacetten keine anderen Personenfilter entfernen
          // Damit das Backend die richtigen Daten für jedes Facet liefern kann
      } else {
          // Für andere Facettentypen nur den aktuellen Parameter entfernen
          p.delete(facetField);
      }

      // Neue Parameter hinzufügen
      Object.entries(extra).forEach(([k, v]) => p.set(k, v));
      p.append('facet', facetField);

      return p.toString();
  }

  /* ---------- Generic select2 autocomplete ---------------------- */
  function initFacetAutocomplete(paramName, selectorId, placeholder, useNameAsId = false) {
      const $sel = $(selectorId);
      if ($sel.data('select2')) $sel.select2('destroy');

      $sel.select2({
          placeholder,
          allowClear: true,
          ajax: {
              delay: 250,
              url: () => '/api/facet/?' + buildFacetUrl(paramName),
              data: params => ({ term: params.term }),
              processResults: data => ({
                  results: data.map(o => ({
                      id: useNameAsId ? o.name : (o.id ?? o.name),
                      text: `${o.name} (${o.count})`
                  }))
              }),
              cache: true,
              minimumInputLength: 0,
              quietMillis: 250
          }
      });

      /* ---- vorausgewählte Werte wiederherstellen ---------------- */
      const current = new URLSearchParams(window.location.search).getAll(paramName);
      $sel.find('option:not(:first)').remove();

      current.forEach(val => {
          fetch(`/api/facet/?facet=${paramName}&${paramName}=${encodeURIComponent(val)}&term=${encodeURIComponent(val)}`)
              .then(r => r.json())
              .then(arr => {
                  const o = arr.find(x => String(x.id ?? x.name) === val || x.name === val);
                  const txt = o ? `${o.name} (${o.count})` : `${val} (0)`;
                  if ($sel.find(`option[value="${val}"]`).length === 0) {
                      $sel.append(new Option(txt, val, true, true)).trigger('change.select2');
                  }
              })
              .catch(() => {
                  $sel.append(new Option(`${val} (0)`, val, true, true)).trigger('change.select2');
              });
      });
  }

  /* ---------- Slg & SlgTeil (unverändert) ----------------------- */
  function fillSelect(sel, data, paramName) {
      /* Fügt Datensätze in ein <select> ein und stellt bereits gewählte
         Werte wieder her.  */

      const selected = new URLSearchParams(window.location.search)
          .getAll(paramName)                                   // Array!
          .map(String);

      /* 0) Platzhalter + Reset -------------------------------------- */
      sel.innerHTML = '';
      sel.appendChild(new Option('Alle …', ''));

      /* 1) Haupt-Daten einfügen ------------------------------------- */
      const returned = new Set();

      data.forEach(o => {
          const value = String(o.id ?? o.name);               // Wert immer String
          returned.add(value);

          const label = `${o.name ?? o.label ?? o.bezeichnung ?? value} (${o.count})`;
          const isSel = selected.includes(value);

          sel.appendChild(new Option(label, value, isSel, isSel));
      });

      /* 2) Fehlende, aber ausgewählte IDs nachladen ----------------- */
      selected.forEach(v => {
          if (returned.has(v)) return;             // ist schon drin

          fetch(`/api/facet/?facet=${paramName}&${paramName}=${encodeURIComponent(v)}`)
              .then(r => r.json())
              .then(arr => {
                  const o = arr.find(x => String(x.id ?? x.name) === v);
                  const label = o ? `${o.name ?? o.label ?? o.bezeichnung ?? v} (${o.count})`
                      : `(ID ${v}) (0)`;
                  sel.appendChild(new Option(label, v, true, true));
                  if (window.jQuery && $(sel).data('select2')) $(sel).trigger('change');
              })
              .catch(() => {
                  sel.appendChild(new Option(`(ID ${v}) (0)`, v, true, true));
              });
      });

      /* 3) Select2 auffrischen -------------------------------------- */
      sel.disabled = false;
      if (window.jQuery && $(sel).data('select2')) $(sel).trigger('change');
  }

  function loadSammlungen() {
      fetch('/api/facet/?' + buildFacetUrl('Slg'))
          .then(r => r.json())
          .then(data => {
              const sel = document.getElementById('SlgSelect');
              fillSelect(sel, data, 'Slg');

              if (window.jQuery) {
                  const $sel = $(sel);
                  if (!$sel.data('select2')) {
                      $sel.select2({ placeholder: 'Sammlung wählen …' })
                          .on('select2:select select2:unselect', onFacetChange);
                      allowClear: true
                  } else {
                      $sel.trigger('change.select2');
                  }
              }

              const v = sel.value;
              if (v) loadSlgTeile(v);
          })
          .catch(e => console.error('Slg-Load-Error', e));
  }

  function loadSlgTeile(slgId) {
      const sel = document.getElementById('SlgteilSelect');
      sel.disabled = true;
      sel.innerHTML = '<option>Lade …</option>';

      fetch('/api/facet/?' + buildFacetUrl('SlgTeil', { Slg: slgId }))
          .then(r => r.json())
          .then(data => {
              fillSelect(sel, data, 'SlgTeil');

              if (window.jQuery) {
                  const $sel = $(sel);
                  if (!$sel.data('select2')) {
                      $sel.select2({ placeholder: 'Sammlungsteil wählen …' });
                  }
                  $sel.prop('disabled', false).trigger('change.select2');
              } else {
                  sel.disabled = false;
              }
          })
          .catch(e => {
              console.error('SlgTeil-Load-Error', e);
              sel.innerHTML = '<option>Fehler beim Laden</option>';
          });
  }

  /* ---------- Spezialfacetten per Alias ------------------------- */
  {% comment %} Wenn dieser Parameter auf true gesetzt ist, wird o.name als id  {% endcomment %}
  const initMuenzstaettenAutocomplete = () =>
      initFacetAutocomplete('Muenzstaette', '#MzstaetteSelect', 'Münzstätte suchen …', true);
  const initNominalAutocomplete = () =>
      initFacetAutocomplete('Nominal', '#NominalSelect', 'Nominal suchen …', true);
  const initHerMerkAutocomplete = () =>
      initFacetAutocomplete('her_merk', '#HmerkSelect', 'Herstellungsmerkmale suchen …', true);
  const initSekMerkAutocomplete = () =>
      initFacetAutocomplete('sek_merk', '#SmerkSelect', 'Sekundäre Merkmale suchen …', true);
  const initPraegeherrenAutocomplete = () =>
      initFacetAutocomplete('Praegeherren', '#PraegeherrenSelect', 'Prägeherren suchen …', true);
  const initPersonAutocomplete = () =>
      initFacetAutocomplete('Person', '#PersonSelect', 'Personen suchen …', true);
  const initWappenAutocomplete = () =>
      initFacetAutocomplete('Wappen', '#WappenSelect', 'Wappen suchen …', true);
  const initAvBildtypAutocomplete = () =>
      initFacetAutocomplete('av_bildtyp', '#AvBildtypSelect', 'Beschreibungen suchen …');
  const initRvBildtypAutocomplete = () =>
      initFacetAutocomplete('rv_bildtyp', '#RvBildtypSelect', 'Beschreibungen suchen …');
  const initAvSchlagworteAutocomplete = () =>
      initFacetAutocomplete('av_schlagwort', '#AvSchlagworteFormControlSelect2', 'Schlagworte suchen …', true);
  const initRvSchlagworteAutocomplete = () =>
      initFacetAutocomplete('rv_schlagwort', '#RvSchlagworteFormControlSelect2', 'Schlagworte suchen …', true);
  const initAvDargestellteAutocomplete = () => {
      const selector = '#AvDargestellteSelect';
      if (document.querySelector(selector)) {
          initFacetAutocomplete('Dargestellte_AV', selector, 'Dargestellte/r suchen …', true);
      } else {
          console.warn('Element not found:', selector);
      }
  };
  const initRvDargestellteAutocomplete = () => {
      const selector = '#RvDargestellteSelect';
      if (document.querySelector(selector)) {
          initFacetAutocomplete('Dargestellte_RV', selector, 'Dargestellte/r suchen …', true);
      } else {
          console.warn('Element not found:', selector);
      }
  };
  const initLiteraturAutocomplete = () =>
      initFacetAutocomplete('Ref', '#LiteraturSelect', 'Referenz suchen …', true);
  const initCoinTypeAutocomplete = () =>
      initFacetAutocomplete('coin_type', '#CoinTypeSelect', 'Münztyp-Nummer suchen …');
  const initMaterialAutocomplete = () =>
      initFacetAutocomplete('material', '#MaterialSelect', 'Material suchen …', true);

  /* ---------- Facet-Änderung ------------------------------------ */
  const onFacetChange = evt => {
      const sel = evt.target;
      const name = sel.name;
      const p = new URLSearchParams(window.location.search);

      p.delete(name);
      ([].concat($(sel).val() || [])).forEach(v => p.append(name, v));
      if (name === 'Slg') p.delete('SlgTeil');

      updateHistoryForBfcache(p);

      loadSammlungen();
      initMuenzstaettenAutocomplete();
      initNominalAutocomplete();
      initHerMerkAutocomplete();
      initSekMerkAutocomplete();
      initPraegeherrenAutocomplete();
      initPersonAutocomplete();
      initWappenAutocomplete();
      initAvBildtypAutocomplete();
      initRvBildtypAutocomplete();
      initAvSchlagworteAutocomplete();
      initRvSchlagworteAutocomplete();
      initAvDargestellteAutocomplete();
      initRvDargestellteAutocomplete();
      initLiteraturAutocomplete();
      initCoinTypeAutocomplete();
      initMaterialAutocomplete();
  };

  /* ---------- Text Input Änderung ------------------------------- */
  const onTextInputChange = debounce(evt => {
      const input = evt.target;
      const name = input.name;
      const value = input.value.trim();
      const p = new URLSearchParams(window.location.search);

      if (value) {
          p.set(name, value);
      } else {
          p.delete(name);
      }

      updateHistoryForBfcache(p);

      // Facets neu laden nach Text-Änderung
      loadSammlungen();
      initMuenzstaettenAutocomplete();
      initNominalAutocomplete();
      initHerMerkAutocomplete();
      initSekMerkAutocomplete();
      initPraegeherrenAutocomplete();
      initPersonAutocomplete();
      initWappenAutocomplete();
      initAvBildtypAutocomplete();
      initRvBildtypAutocomplete();
      initAvSchlagworteAutocomplete();
      initRvSchlagworteAutocomplete();
      initAvDargestellteAutocomplete();
      initRvDargestellteAutocomplete();
      initLiteraturAutocomplete();
      initCoinTypeAutocomplete();
      initMaterialAutocomplete();
  }, 500);

  /* ---------- Freitextsuche ------------------------------------ */
  function writeSearchToUrl() {
      const p = new URLSearchParams(window.location.search);

      const termIn = $('#searchInput');

      const key = termIn.attr('name');
      const term = termIn.val().trim();

      if (key) {
          if (term) {
              p.set(key, term);
          } else {
              p.delete(key);
          }
      }

      p.delete('unbestimmt');
      const indefVal = $('#bestimmungSelect').val();
      if (indefVal) {
          p.set('unbestimmt', indefVal);
      }

      updateHistoryForBfcache(p);
  }

  function executeSearch() {
      writeSearchToUrl();
      window.location.href = window.location.pathname + window.location.search;
  }

  /***************** Event Binding *****************/
  document.addEventListener('DOMContentLoaded', () => {
      /* 1. Facets initialisieren */
      loadSammlungen();
      initMuenzstaettenAutocomplete();
      initNominalAutocomplete();
      initHerMerkAutocomplete();
      initSekMerkAutocomplete();
      initPraegeherrenAutocomplete();
      initPersonAutocomplete();
      initWappenAutocomplete();
      initAvBildtypAutocomplete();
      initRvBildtypAutocomplete();
      initAvSchlagworteAutocomplete();
      initRvSchlagworteAutocomplete();
      initAvDargestellteAutocomplete();
      initRvDargestellteAutocomplete();
      initLiteraturAutocomplete();
      initCoinTypeAutocomplete();
      initMaterialAutocomplete();

      /* 2. Change-Events für alle Select2-Filter */
      $(document).on('select2:select select2:unselect', '.select2-filter', onFacetChange);

      /* 3. Change-Events für Text-Input-Filter */
      $(document).on('input', '.text-input-filter', onTextInputChange);

      /* 4. Enter-Taste für sofortige Suche */
      $(document).on('keyup', '.text-input-filter', function (e) {
          if (e.key === 'Enter') {
              const input = e.target;
              const name = input.name;
              const value = input.value.trim();
              const p = new URLSearchParams(window.location.search);

              if (value) {
                  p.set(name, value);
              } else {
                  p.delete(name);
              }

              // Sofort zur neuen URL navigieren
              window.location.href = window.location.pathname + '?' + p.toString();
          }
      });

      /* ---------- Freitextsuche -------------------- */
      const catSel = $('#rubrikSelect');
      const termIn = $('#searchInput');
      const indefSel = $('#bestimmungSelect');

      catSel.on('change', () => termIn.attr('name', catSel.val()));
      $('#freitextForm').on('submit', function (e) {
          if (window.location.pathname.includes('/browse')) {
              e.preventDefault();
              executeSearch();
          }
      });
      termIn.on('keyup', e => { if (e.key === 'Enter') $('#freitextForm').submit(); });
      indefSel.on('change', () => $('#freitextForm').submit());
  });

  // BFCache-kompatible History Updates
  function updateHistoryForBfcache(params) {
      // Kleinere Verzögerung um Browser-Optimierungen zu ermöglichen
      requestAnimationFrame(() => {
          history.replaceState(null, '', '?' + params.toString());
      });
  }
</script>
