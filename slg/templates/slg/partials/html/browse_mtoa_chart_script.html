<script>
  let browseChart = null;

  document.addEventListener("DOMContentLoaded", function () {
    loadChartData();
  });

  function loadChartData() {
    const apiEndpoint = "{% url 'area_chart_data' %}";
    const fetchUrl = apiEndpoint + window.location.search;

    fetch(fetchUrl)
      .then(r => {
        if (!r.ok) throw new Error(`Server-Antwort fehlgeschlagen: ${r.status} ${r.statusText}`);
        return r.json();
      })
      .then(data => {
        if (data.error) {
          showEmptyChart(`${data.error}${data.details ? '\n' + data.details : ''}`);
          return;
        }

        if (!data.years || data.years.length === 0) {
          showEmptyChart("Keine Daten für diesen Zeitraum verfügbar");
          return;
        }

        let years = data.years || [];
        let absoluteValues = data.counts || [];

        const urlParams = new URLSearchParams(window.location.search);
        const filterFrom = parseInt(urlParams.get('dat_von'), 10);
        const filterTo   = parseInt(urlParams.get('dat_bis'), 10);

        if (Number.isFinite(filterFrom) || Number.isFinite(filterTo)) {
          const lo = Number.isFinite(filterFrom) ? filterFrom : -Infinity;
          const hi = Number.isFinite(filterTo)   ? filterTo   :  Infinity;

          const filtered = years.reduce((acc, y, i) => {
            if (y >= lo && y <= hi) { acc.y.push(y); acc.c.push(absoluteValues[i]); }
            return acc;
          }, { y: [], c: [] });

          years = filtered.y;
          absoluteValues = filtered.c;
        }

        renderEChart(years, absoluteValues);

        if (years.length > 0) {
          updateDateSliderRange(years[0], years[years.length - 1]);
        }
      })
      .catch(err => {
        showEmptyChart(err.message);
      });
  }

  function formatYear(value) {
    const n = parseInt(value, 10);
    if (isNaN(n)) return value;
    if (n < 0) return Math.abs(n) + ' v.Chr.';
    if (n === 0) return '0';
    return n.toString();
  }

  function renderEChart(years, absoluteValues) {
    const container = document.getElementById('objectsBarChart');
    if (!container) return;

    if (browseChart) {
      browseChart.dispose();
    }

    browseChart = echarts.init(container, null, { renderer: 'canvas' });

    const labels = years.map(y => y.toString());

    const accentColor = '#f6b15d';
    const accentRgba  = 'rgba(246, 177, 93, 0.12)';
    const textColor   = '#d4c5a0';
    const axisColor   = '#8a7d65';
    const gridColor   = 'rgba(255, 255, 255, 0.06)';
    const gridDashed  = 'rgba(255, 255, 255, 0.04)';
    const bgColor     = '#161616';
    const tooltipBg   = 'rgba(16, 16, 16, 0.95)';
    const sliderBorder = 'rgba(246, 177, 93, 0.25)';
    const sliderText   = '#a89a7e';

    const option = {
      backgroundColor: bgColor,
      grid: {
        left: '5%', right: '5%', top: '10%', bottom: '18%',
        containLabel: true
      },
      dataZoom: [
        { type: 'inside', start: 0, end: 100 },
        {
          type: 'slider', start: 0, end: 100, bottom: '3%',
          borderColor: sliderBorder,
          textStyle: { color: sliderText },
          dataBackground: {
            lineStyle: { color: axisColor },
            areaStyle: { color: 'rgba(246, 177, 93, 0.08)' }
          },
          selectedDataBackground: {
            lineStyle: { color: accentColor },
            areaStyle: { color: 'rgba(246, 177, 93, 0.2)' }
          },
          backgroundColor: 'transparent',
          fillerColor: 'rgba(246, 177, 93, 0.12)',
          handleStyle: {
            color: accentColor,
            borderColor: sliderBorder
          }
        }
      ],
      xAxis: {
        type: 'category',
        boundaryGap: false,
        data: labels,
        name: 'Chronologie',
        nameLocation: 'middle',
        nameGap: 40,
        nameTextStyle: { color: textColor, fontSize: 13, fontWeight: 600 },
        axisLine: { lineStyle: { color: axisColor, width: 1.5 } },
        axisTick: { show: true, alignWithLabel: true, lineStyle: { color: axisColor } },
        axisLabel: { formatter: formatYear, color: axisColor, fontWeight: 500 },
        splitLine: { show: true, lineStyle: { color: gridDashed, type: 'dashed' } }
      },
      yAxis: {
        type: 'value',
        name: 'Stückzahl',
        nameTextStyle: { color: textColor, fontSize: 13, fontWeight: 600, padding: [0, 0, 8, 0] },
        axisLine: { show: true, lineStyle: { color: axisColor, width: 1.5 } },
        axisLabel: { color: axisColor, fontWeight: 500 },
        splitLine: { lineStyle: { color: gridColor, type: 'solid' } }
      },
      tooltip: {
        trigger: 'axis',
        backgroundColor: tooltipBg,
        borderColor: 'rgba(246, 177, 93, 0.4)',
        textStyle: { color: '#e8dcc8' },
        axisPointer: {
          type: 'cross',
          lineStyle: { color: axisColor, width: 1, type: 'dashed' }
        },
        formatter: function(params) {
          const p = params[0];
          return '<div style="font-weight:600;margin-bottom:4px;border-bottom:1px solid rgba(246,177,93,0.3);padding-bottom:4px;">Jahr: '
            + formatYear(p.axisValue) + '</div>'
            + '<span style="display:inline-block;width:10px;height:10px;background-color:'
            + p.color + ';margin-right:5px;border-radius:50%;"></span>'
            + 'Stückzahl: <b>' + p.data + ' Objekte</b>';
        }
      },
      series: [{
        name: 'Anzahl der Objekte',
        type: 'line',
        smooth: 0.3,
        symbol: 'circle',
        symbolSize: 3,
        showSymbol: false,
        lineStyle: { width: 2.5, color: accentColor },
        itemStyle: { color: accentColor },
        areaStyle: {
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: 'rgba(246, 177, 93, 0.25)' },
            { offset: 1, color: 'rgba(246, 177, 93, 0.02)' }
          ])
        },
        emphasis: {
          focus: 'series',
          lineStyle: { width: 3.5 }
        },
        data: absoluteValues
      }]
    };

    browseChart.setOption(option);

    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => browseChart.resize());
      ro.observe(container);
      browseChart.__ro = ro;
    }

    window.browseChart = browseChart;
  }

  function updateDateSliderRange(minYear, maxYear) {
    const dateSlider = document.getElementById('date-range-slider');
    if (dateSlider && dateSlider.noUiSlider) {
      if (minYear === maxYear) {
        minYear = minYear - 1;
        maxYear = maxYear + 1;
      }

      dateSlider.noUiSlider.updateOptions({
        range: { 'min': minYear, 'max': maxYear }
      }, false);

      document.getElementById('date-min-value').textContent = minYear;
      document.getElementById('date-max-value').textContent = maxYear;

      const urlParams = new URLSearchParams(window.location.search);
      const paramMin = urlParams.get('dat_von') ? parseInt(urlParams.get('dat_von')) : minYear;
      const paramMax = urlParams.get('dat_bis') ? parseInt(urlParams.get('dat_bis')) : maxYear;

      const newMin = Math.max(minYear, Math.min(paramMin, maxYear));
      const newMax = Math.max(minYear, Math.min(paramMax, maxYear));

      dateSlider.noUiSlider.set([newMin, newMax]);
    }
  }

  function showEmptyChart(message) {
    const container = document.getElementById('objectsBarChart');
    if (!container) return;

    if (browseChart) {
      browseChart.dispose();
    }

    browseChart = echarts.init(container, null, { renderer: 'canvas' });

    browseChart.setOption({
      backgroundColor: '#161616',
      title: {
        text: message,
        left: 'center',
        top: 'center',
        textStyle: {
          color: '#8a7d65',
          fontSize: 15,
          fontWeight: 400
        }
      }
    });

    window.browseChart = browseChart;
  }
</script>
