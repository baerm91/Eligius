<script>
  // Sichere Plugin-Verfügbarkeit prüfen
  function initializeMapWithClustering() {
    console.log("Initializing map...");

    // Karte erstellen
    const map = L.map('mintMap', {
      scrollWheelZoom: false,
      zoomControl: true,
      doubleClickZoom: true
    }).setView([48.2082, 16.3719], 5);

    EligiusMaps.addDarkBasemap(map);

    // Scroll-Zoom Einstellungen (bestehender Code)
    map.scrollWheelZoom.disable();
    map.on('focus', function () { map.scrollWheelZoom.enable(); });
    map.on('blur', function () { map.scrollWheelZoom.disable(); });

    L.DomEvent.addListener(map.getContainer(), 'wheel', function (e) {
      if (e.ctrlKey) {
        e.preventDefault();
        map.scrollWheelZoom.enable();
        setTimeout(function () { map.scrollWheelZoom.disable(); }, 1000);
      }
    });

    // Marker-Gruppe erstellen - mit Fallback
    let markersGroup;

    if (typeof L.markerClusterGroup === 'function') {
      console.log("✅ MarkerCluster Plugin verfügbar - verwende Clustering");
      markersGroup = L.markerClusterGroup({
        chunkedLoading: true,
        chunkInterval: 200,
        maxClusterRadius: 50,
        spiderfyOnMaxZoom: true,
        zoomToBoundsOnClick: true,
        iconCreateFunction: function (cluster) {
          const count = cluster.getChildCount();
          let className = 'marker-cluster-';

          if (count < 10) className += 'small';
          else if (count < 100) className += 'medium';
          else className += 'large';

          return new L.DivIcon({
            html: `<div><span>${count}</span></div>`,
            className: `marker-cluster ${className}`,
            iconSize: new L.Point(40, 40)
          });
        }
      });
    } else {
      console.warn("⚠️ MarkerCluster Plugin nicht verfügbar - verwende normale FeatureGroup");
      markersGroup = L.featureGroup();
    }

    // Münzstätten-Daten laden
    const mintsData = {{ mints_map }};
    const escapeMapHtml = (value) => String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
    console.log(`Loading ${Object.keys(mintsData).length} mint markers...`);

  // Marker erstellen
  const markers = [];
  Object.values(mintsData).forEach(mint => {
    if (mint.latitude && mint.longitude) {
      const url = new URL(window.location.href);
      url.searchParams.set('Muenzstaette', mint.filter_value || mint.name);

      // ✅ POPUP mit Objektanzahl
      const marker = L.marker([mint.latitude, mint.longitude], {alt: mint.name, title: mint.name})
        .bindPopup(`
              <div class="mint-popup">
                <strong>
                  <a href="${escapeMapHtml(url.toString())}" style="text-decoration:underline;">
                    ${escapeMapHtml(mint.name)}
                  </a>
                </strong><br>
                Region: ${escapeMapHtml(mint.region)}<br>
                <div class="mint-info mt-2">
                  <span class="badge bg-primary me-1">
                    <i class="bi bi-coin"></i> ${Number(mint.count) || 0} Objekte
                  </span>
                  <span class="badge bg-success">
                    <i class="bi bi-geo-alt"></i> ${escapeMapHtml(mint.name)}
                  </span>
                </div>
              </div>
            `);

      markers.push(marker);
    }
  });

  // Marker zur Gruppe hinzufügen
  if (markers.length > 0) {
    if (markersGroup.addLayers) {
      // Batch-Add für Clustering
      markersGroup.addLayers(markers);
    } else {
      // Einzeln hinzufügen für normale FeatureGroup
      markers.forEach(marker => markersGroup.addLayer(marker));
    }

    markersGroup.addTo(map);
    map.fitBounds(markersGroup.getBounds(), { padding: [30, 30] });
    console.log(`✅ ${markers.length} markers loaded successfully`);
  }

  const fullscreenButton = document.getElementById('customFullscreenBtn');
  const exitButton = document.getElementById('exitFullscreenBtn');
  const instructions = document.getElementById('fullscreenInstructions');
  const mapContainer = map.getContainer();
  const fullscreenEvents = new AbortController();
  const listenerOptions = {signal: fullscreenEvents.signal};

  function setFullscreen(active, restoreFocus = true) {
    mapContainer.classList.toggle('map-fullscreen', active);
    fullscreenButton.setAttribute('aria-expanded', String(active));
    exitButton.style.display = active ? 'block' : '';
    instructions.style.display = active ? 'block' : '';
    document.body.style.overflow = active ? 'hidden' : '';
    if (restoreFocus) {
      (active ? exitButton : fullscreenButton).focus({preventScroll: true});
      map.invalidateSize();
    }
  }

  fullscreenButton.addEventListener('click', () => setFullscreen(true), listenerOptions);
  exitButton.addEventListener('click', () => setFullscreen(false), listenerOptions);
  document.addEventListener('keydown', event => {
    if (!mapContainer.classList.contains('map-fullscreen')) return;
    if (event.key === 'Escape') {
      setFullscreen(false);
    } else if (event.key === 'Tab') {
      const controls = [exitButton, mapContainer, ...mapContainer.querySelectorAll('a[href], button, [tabindex="0"]')]
          .filter(control => !control.disabled && control.tabIndex >= 0 && control.getClientRects().length);
      const index = controls.indexOf(document.activeElement);
      const next = index < 0 ? 0 : (index + (event.shiftKey ? -1 : 1) + controls.length) % controls.length;
      event.preventDefault();
      controls[next]?.focus();
    }
  }, listenerOptions);
  map.once('unload', () => {
    fullscreenEvents.abort();
    if (mapContainer.classList.contains('map-fullscreen')) setFullscreen(false, false);
  });

  return map;
    }

  // Map-Initialisierung erfolgt über initializePageResources() im BFCache-Script
</script>
