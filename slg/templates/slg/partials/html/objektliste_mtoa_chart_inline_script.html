<script>
  // ========== CHART-CODE (WIEDERHERGESTELLT) ==========
  // Globale Chart-Variable definieren
  let barChart;

  document.addEventListener("DOMContentLoaded", function () {
    // 1. Überprüfe, ob die Plugins geladen wurden
    console.log("Chart.js version:", Chart.version);
    console.log("ChartZoom Plugin loaded:", typeof ChartZoom !== 'undefined');

    // 2. Lade Daten und erstelle Chart
    loadBarChartData();
  });

  function loadBarChartData() {
    const apiEndpoint = "{% url 'area_chart_data' %}";
    const fetchUrl = apiEndpoint + window.location.search;

    console.log("Lade Daten von:", fetchUrl);

    fetch(fetchUrl)
      .then(r => {
        console.log("Server-Antwort Status:", r.status);
        if (!r.ok) {
          throw new Error(`Server-Antwort fehlgeschlagen: ${r.status} ${r.statusText}`);
        }
        return r.json();
      })
      .then(data => {
        console.log("Rohdaten vom Server:", data);

        // Fehlerverarbeitung
        if (data.error) {
          console.error("Server-Fehler:", data.error);
          const errorDetails = data.details || '';
          showErrorChart(`${data.error}${errorDetails ? '\n' + errorDetails : ''}`);

          if (data.debug) {
            console.log("Debug-Info trotz Fehler:", data.debug);
          }
          return;
        }

        // Debug-Informationen
        if (data.debug) {
          console.log("Chart-Daten Debug:", data.debug);
        }

        // Prüfen auf leere Daten
        if (!data.years || data.years.length === 0) {
          console.warn("Keine Jahres-Daten vorhanden:", data);
          showEmptyChart("Keine Daten für diesen Zeitraum verfügbar");
          return;
        }

        // Basics bereiten
        const years = data.years || [];
        const percentages = data.percentages || [];
        const absoluteValues = data.counts || [];
        const labels = years.map(y => y.toString());

        console.log("Zeitreihe:", {
          periode: years.length > 0 ? `${years[0]} bis ${years[years.length - 1]}` : "Leer",
          anzahlJahre: years.length,
          gesamtProzent: percentages.reduce((sum, p) => sum + p, 0).toFixed(2) + "%",
          gesamtObjekte: absoluteValues.reduce((sum, v) => sum + v, 0).toFixed(2),
        });

        // Chart-Element
        const canvas = document.getElementById('objectsBarChart');
        const ctx = canvas.getContext('2d');

        // Alte Instanz zerstören
        if (barChart) {
          console.log("Zerstöre alten Chart");
          barChart.destroy();
        }

        // Check if the zoom plugin is available
        if (!Chart.helpers || !Chart.helpers.merge) {
          console.error("Chart.helpers.merge not available");
        }

        // Neuen Chart erstellen
        console.log("Erstelle neuen Chart");
        barChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'Anteil der Objekte (%)',
              data: percentages,
              backgroundColor: 'rgba(32, 178, 170, 0.5)',
              borderColor: 'rgb(0, 139, 139)',
              borderWidth: 2,
              fill: true,
              tension: 0.3,
              pointRadius: 4,
              pointBackgroundColor: 'rgb(0, 139, 139)',
              pointBorderColor: '#fff',
              pointBorderWidth: 1,
              spanGaps: false,
              absoluteValues: absoluteValues // Speichere absolute Werte im Dataset
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: { title: { display: true, text: 'Jahr' } },
              y: {
                beginAtZero: true,
                title: { display: true, text: 'Prozent (%)' },
                ticks: { callback: value => value + '%' }
              }
            },
            plugins: {
              tooltip: {
                callbacks: {
                  label: function (context) {
                    const datasetIndex = context.datasetIndex;
                    const dataIndex = context.dataIndex;
                    const percentage = context.raw;
                    const dataset = context.chart.data.datasets[datasetIndex];
                    const absoluteValue = dataset.absoluteValues[dataIndex];

                    return `Anteil: ${percentage}% (${absoluteValue} Objekte)`;
                  }
                }
              },
              zoom: {
                limits: {
                  y: { min: 0 }
                },
                pan: {
                  enabled: true,
                  mode: 'x',
                  threshold: 10
                },
                zoom: {
                  wheel: {
                    enabled: true,
                    modifierKey: 'ctrl'
                  },
                  pinch: {
                    enabled: true
                  },
                  mode: 'x'
                }
              }
            },
            onHover: (event, elements) => {
              event.native.target.style.cursor = elements.length ? 'pointer' : 'grab';
            }
          }
        });

        // Add direct wheel event handler to the chart canvas
        const chartCanvas = document.getElementById('objectsBarChart');
        chartCanvas.addEventListener('wheel', function (e) {
          if (e.ctrlKey) {
            console.log("Direct Ctrl+wheel event on chart detected");
            e.preventDefault();
          }
        }, { passive: false });

        console.log("Chart erstellt:", barChart);

        // Chart in globalen Scope setzen für andere Funktionen
        window.barChart = barChart;

        // Update date slider range based on chart data
        if (years.length > 0) {
          updateDateSliderRange(years[0], years[years.length - 1]);
        }
      })
      .catch(err => {
        console.error("Chart-Daten Fehler:", err);
        showErrorChart(err.message);
      });
  }

  // Function to update date slider range
  function updateDateSliderRange(minYear, maxYear) {
    const dateSlider = document.getElementById('date-range-slider');
    if (dateSlider && dateSlider.noUiSlider) {
      console.log(`Updating date slider range: ${minYear} - ${maxYear}`);

      // Check if min and max are equal
      if (minYear === maxYear) {
        minYear = minYear - 1;
        maxYear = maxYear + 1;
        console.log(`Adjusted range to avoid equal min/max: ${minYear} - ${maxYear}`);
      }

      // Update slider range
      dateSlider.noUiSlider.updateOptions({
        range: {
          'min': minYear,
          'max': maxYear
        }
      }, false);

      // Update display values
      document.getElementById('date-min-value').textContent = minYear;
      document.getElementById('date-max-value').textContent = maxYear;

      // Update slider values based on URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const paramMin = urlParams.get('dat_von') ? parseInt(urlParams.get('dat_von')) : minYear;
      const paramMax = urlParams.get('dat_bis') ? parseInt(urlParams.get('dat_bis')) : maxYear;

      const newMin = Math.max(minYear, Math.min(paramMin, maxYear));
      const newMax = Math.max(minYear, Math.min(paramMax, maxYear));

      dateSlider.noUiSlider.set([newMin, newMax]);
    }
  }

  // Hilfsfunktion für leere Charts
  function showEmptyChart(message) {
    const canvas = document.getElementById('objectsBarChart');
    const ctx = canvas.getContext('2d');

    if (barChart) {
      barChart.destroy();
    }

    barChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Keine Daten'],
        datasets: [{
          data: [0],
          backgroundColor: 'rgba(200, 200, 200, 0.2)',
          borderColor: 'rgb(200, 200, 200)',
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { enabled: false },
          title: {
            display: true,
            text: message,
            font: { size: 16 },
            padding: 20
          }
        },
        scales: {
          x: { display: false },
          y: { display: false }
        }
      }
    });

    // Chart in globalen Scope setzen
    window.barChart = barChart;
  }

  // Hilfsfunktion für Fehler-Charts
  function showErrorChart(errorMessage) {
    showEmptyChart(`Fehler bei der Datenverarbeitung: ${errorMessage}`);
  }
</script>
