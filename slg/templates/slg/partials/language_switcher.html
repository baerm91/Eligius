{% load i18n %}
{% get_current_language as current_language %}
<form class="language-switcher" action="{% url 'set_language' %}" method="post" aria-label="{% translate 'Sprache' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" name="language" value="de" lang="de" title="Deutsch" aria-label="Deutsch" aria-pressed="{% if current_language == 'de' %}true{% else %}false{% endif %}">DE</button>
  <button type="submit" name="language" value="en" lang="en" title="English" aria-label="English" aria-pressed="{% if current_language == 'en' %}true{% else %}false{% endif %}">EN</button>
</form>
